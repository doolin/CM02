name: CI/CD

on:
  push:
  pull_request:
    branches: [master]

permissions:
  contents: read
  id-token: write
  attestations: write
  security-events: write

jobs:
  compliance:
    name: Golden Pipeline
    uses: ./.github/workflows/golden-pipeline.yml
    with:
      node-version: "20"
    permissions:
      contents: read
      id-token: write
      attestations: write
      security-events: write
    secrets: inherit

  deploy:
    name: Deploy Lambda
    needs: compliance
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Build deployment package
        run: |
          zip -r deployment.zip \
            index.js \
            lib/ \
            data/cm02-control.json \
            public/ \
            node_modules/ \
            -x "*.test.js" "data/NIST_SP-800-53_rev5_catalog.json"

      - name: Generate build provenance (PS.1, PS.2)
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: deployment.zip

      - name: Upload deployment artifact with provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-package
          path: deployment.zip
          retention-days: 90

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-1

      - name: Download SBOM artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom
          path: evidence/

      - name: Download scan results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scan-results
          path: evidence/

      - name: Download OSCAL artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oscal-artifacts
          path: evidence/

      - name: Download evidence manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: evidence-manifest
          path: evidence/

      - name: Archive evidence to S3
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          COMMIT=${GITHUB_SHA:0:12}
          for file in evidence/*.json; do
            BASENAME=$(basename "$file")
            SHA256=$(sha256sum "$file" | cut -d' ' -f1)
            S3KEY="cm02/evidence/${BASENAME%.json}/${TIMESTAMP}-${COMMIT}-${BASENAME}"
            aws s3 cp "$file" "s3://${{ secrets.S3_EVIDENCE_BUCKET || 'inventium-artifacts' }}/${S3KEY}" \
              --checksum-algorithm SHA256 \
              --metadata "sha256-digest=${SHA256},commit=${GITHUB_SHA},run-id=${GITHUB_RUN_ID},artifact-type=${BASENAME%.json}"
            echo "Archived: s3://${{ secrets.S3_EVIDENCE_BUCKET || 'inventium-artifacts' }}/${S3KEY}"
          done

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://deployment.zip \
            --publish

      - name: Wait for update
        run: |
          aws lambda wait function-updated-v2 \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }}

      - name: Smoke test
        run: |
          aws lambda invoke \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --payload '{"httpMethod":"POST","body":"{\"systemName\":\"CI smoke test\",\"implementationStatus\":\"Planned\",\"frequency\":\"annually\",\"circumstances\":\"CI test\",\"implementationNarrative\":\"Automated CI test\",\"responsibleRole\":\"CI\"}"}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/response.json
          cat /tmp/response.json
          BODY=$(jq -r '.body' /tmp/response.json)
          echo "$BODY" | jq -e '.pdf_url'

      - name: Emit pipeline audit summary (M-21-31)
        if: always()
        run: |
          echo '{"event":"deployment_completed","severity":"INFO","status":"${{ job.status }}","commit":"'$GITHUB_SHA'","run_id":"'$GITHUB_RUN_ID'","ref":"'$GITHUB_REF'","actor":"'$GITHUB_ACTOR'","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'
