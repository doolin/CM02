name: CI/CD

on:
  push:
  pull_request:
    branches: [master]

permissions:
  contents: read
  id-token: write
  attestations: write
  security-events: write

jobs:
  compliance:
    name: Golden Pipeline
    uses: ./.github/workflows/golden-pipeline.yml
    with:
      node-version: "20"
    permissions:
      contents: read
      id-token: write
      attestations: write
      security-events: write
    secrets: inherit

  deploy:
    name: Deploy Lambda
    needs: compliance
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 20
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Build deployment package
        run: |
          zip -r deployment.zip \
            index.js \
            lib/ \
            data/cm02-control.json \
            public/ \
            node_modules/ \
            -x "*.test.js" "data/NIST_SP-800-53_rev5_catalog.json"

      - name: Generate build provenance (PS.1, PS.2)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-path: deployment.zip

      - name: Upload deployment artifact with provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deployment-package
          path: deployment.zip
          retention-days: 90

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-1

      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom
          path: evidence/

      - name: Download scan results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scan-results
          path: evidence/

      - name: Download OSCAL artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: oscal-artifacts
          path: evidence/

      - name: Download evidence manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: evidence-manifest
          path: evidence/

      - name: Archive evidence to S3
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          COMMIT=${GITHUB_SHA:0:12}
          BUCKET="${{ secrets.S3_EVIDENCE_BUCKET || 'inventium-artifacts' }}"
          FAILED=0
          for file in evidence/*.json; do
            BASENAME=$(basename "$file")
            SHA256=$(sha256sum "$file" | cut -d' ' -f1)
            S3KEY="cm02/evidence/${BASENAME%.json}/${TIMESTAMP}-${COMMIT}-${BASENAME}"
            if aws s3 cp "$file" "s3://${BUCKET}/${S3KEY}" \
              --checksum-algorithm SHA256 \
              --metadata "sha256-digest=${SHA256},commit=${GITHUB_SHA},run-id=${GITHUB_RUN_ID},artifact-type=${BASENAME%.json}"; then
              echo "Archived: s3://${BUCKET}/${S3KEY}"
            else
              echo "{\"event\":\"s3_evidence_upload_failed\",\"severity\":\"ERROR\",\"artifact\":\"${BASENAME}\",\"bucket\":\"${BUCKET}\",\"key\":\"${S3KEY}\",\"commit\":\"${GITHUB_SHA}\",\"run_id\":\"${GITHUB_RUN_ID}\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" >&2
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more evidence artifacts failed to upload to S3"
            exit 1
          fi

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://deployment.zip \
            --publish

      - name: Wait for update
        run: |
          aws lambda wait function-updated-v2 \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }}

      - name: Smoke test
        run: |
          aws lambda invoke \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --payload '{"httpMethod":"POST","body":"{\"systemName\":\"CI smoke test\",\"implementationStatus\":\"Planned\",\"frequency\":\"annually\",\"circumstances\":\"CI test\",\"implementationNarrative\":\"Automated CI test\",\"responsibleRole\":\"CI\"}"}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/response.json
          cat /tmp/response.json
          BODY=$(jq -r '.body' /tmp/response.json)
          echo "$BODY" | jq -e '.pdf_url'

      - name: Emit pipeline audit summary (M-21-31)
        if: always()
        run: |
          echo '{"event":"deployment_completed","severity":"INFO","status":"${{ job.status }}","commit":"'$GITHUB_SHA'","run_id":"'$GITHUB_RUN_ID'","ref":"'$GITHUB_REF'","actor":"'$GITHUB_ACTOR'","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'

  attest:
    name: Attest CI Artifacts
    needs: [compliance, deploy]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download all CI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ci-artifacts
          merge-multiple: true

      - name: Write Solana keypair to temp file
        env:
          SOLANA_KEYPAIR: ${{ secrets.SOLANA_KEYPAIR }}
        run: |
          if [ -n "$SOLANA_KEYPAIR" ]; then
            KEYPAIR_FILE=$(mktemp)
            printf '%s' "$SOLANA_KEYPAIR" > "$KEYPAIR_FILE"
            chmod 600 "$KEYPAIR_FILE"
            echo "SOLANA_KEYPAIR_PATH=$KEYPAIR_FILE" >> "$GITHUB_ENV"
          fi

      - name: Configure AWS credentials (OIDC)
        if: vars.S3_COMPLIANCE_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-1' }}

      - name: Attest CI artifacts on Solana
        env:
          ARTIFACT_DIR: ci-artifacts
          OUTPUT_DIR: ci-output
          S3_COMPLIANCE_BUCKET: ${{ vars.S3_COMPLIANCE_BUCKET }}
          SOLANA_NETWORK: ${{ vars.SOLANA_NETWORK || 'devnet' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-west-1' }}
        run: node scripts/attest.mjs

      - name: Upload attestation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: attestation
          path: |
            ci-output/ci-artifacts.zip
            ci-output/attestation.pdf
          retention-days: 90

      - name: Cleanup keypair
        if: always()
        run: rm -f "$SOLANA_KEYPAIR_PATH"
